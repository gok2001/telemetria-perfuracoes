spring:
  application:
    name: telemetria-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/telemetria?sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-message: never